<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Camera input · ScriptNovaa</title><link rel="stylesheet" href="/property-security.css"></head><body><main><p>ScriptNovaa · Camera input</p><h1>Send camera video</h1><p id="name"></p><section><label>Pairing link or code<input id="pair" type="password" autocomplete="off"></label><div class="row"><button id="start" class="primary">Start camera</button><button id="stop" class="danger">Stop camera</button><label>Select camera<select id="device"><option value="">Rear camera (default)</option></select></label></div><output id="status" aria-live="polite">Camera off</output><div class="stage"><video id="preview" autoplay muted playsinline></video></div><p>Keep Safari open, your phone unlocked and connected to power. Video goes to your paired dashboard over WebRTC. No microphone is captured.</p></section></main><script src="/camera-input.js"></script></body></html>
