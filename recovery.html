<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover your ScriptNovaa account</title><link rel="stylesheet" href="styles.css?v=20260727-limited1"></head>
<body data-page="recovery"><header class="site-header"><nav class="nav"><a class="brand" href="/"><span class="brand-mark"><img src="/logo.PNG" alt="ScriptNovaa logo" onerror="this.style.display='none';this.parentNode.classList.add('logo-fallback')"></span><span>ScriptNovaa</span></a><div class="nav-links"><a href="/signin">Return to sign in</a></div></nav></header>
<main class="auth-shell"><section class="auth-panel"><p class="kicker">Account recovery</p><h1>Reset your PIN</h1><form id="recovery-form"><label for="recovery-user">Username</label><input id="recovery-user" required><label for="recovery-code">Recovery code</label><input id="recovery-code" required><label for="recovery-pin">New PIN</label><input id="recovery-pin" type="password" inputmode="numeric" pattern="\d{4,8}" required><button>Reset PIN</button></form><div id="recovery-message" class="message"></div></section><aside class="auth-aside"><h2>Your code works once.</h2><p>After a successful reset, the old recovery code stops working and a replacement is generated.</p></aside></main><script src="app.js?v=20260727-limited2"></script></body></html>
